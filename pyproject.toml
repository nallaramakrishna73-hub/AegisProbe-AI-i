[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisprobe-ai"
version = "1.0.0"
description = "AegisProbe AI — AI Security Assessment Framework for Kali Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AegisProbe AI Security Research Team" }
]
keywords = [
    "kali-linux",
    "cybersecurity",
    "ai-security",
    "llm-security",
    "prompt-injection",
    "jailbreak-resistance",
    "mcp-security",
    "red-team"
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",
    "pyyaml>=6.0.1",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[project.scripts]
aegisprobe = "aegisprobe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegisprobe*"]
